[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fusion-cache"
version = "0.1.0"
description = "Fusion cache for LLM APIs: exact -> semantic -> prefix-cache-accounting in one middleware layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "om-fusion-cache contributors" }]
keywords = ["llm", "cache", "openai", "deepseek", "semantic", "semantic-cache", "prefix-cache", "middleware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.24",
    "numpy>=1.24",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
gateway = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=7.0", "pytest-asyncio>=0.23", "respx>=0.20"]

[project.scripts]
fusion-cache = "fusion_cache.cli:main"

[project.urls]
Repository = "http://192.168.1.21:3000/dev/fusion-cache"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion_cache"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
